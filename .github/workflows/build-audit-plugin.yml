name: Build Audit Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/bali-eling-spirit-audit-engine/**'
      - 'scripts/build-audit-plugin.sh'
      - '.github/workflows/build-audit-plugin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check PHP
        run: |
          php -l plugins/bali-eling-spirit-audit-engine/bali-eling-spirit-audit-engine.php
          php -l plugins/bali-eling-spirit-audit-engine/includes/class-bes-audit-engine.php
      - name: Build installable ZIP
        run: bash scripts/build-audit-plugin.sh
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: bali-eling-spirit-audit-engine-v0.1.0
          path: dist/bali-eling-spirit-audit-engine-v0.1.0.zip
          if-no-files-found: error
